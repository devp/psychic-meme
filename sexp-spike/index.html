<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Fennel Node Editor</title>

<style>
/* Layout: one-screen phone app. Log scrolls on top; the structural editor, a breadcrumb of
   the focused node, and a thumb-zone action bar sit at the bottom. Tokens follow
   pizza-repl-fennel's theme.css (dark first, plus a light variant). */
:root {
  --bg: #12141a; --bg-alt: #1a1d26; --bg-raised: #20242f;
  --fg: #e4e6ee; --fg-dim: #8a8fa3; --accent: #7dd3a8; --accent-ink: #10241a;
  --border: #2a2e3a; --err: #f07b7b;
  --k-paren: #f2a65a; --k-bracket: #6cb6f5; --k-brace: #c79bf0;
  --focus-bg: rgba(125, 211, 168, .16); --parent-line: rgba(125, 211, 168, .45);
  --font-mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #faf7f0; --bg-alt: #f1ecdf; --bg-raised: #ffffff;
  --fg: #2b2620; --fg-dim: #7a7263; --accent: #b5562f; --accent-ink: #fff6ef;
  --border: #ded5bf; --err: #b42318;
  --k-paren: #c2410c; --k-bracket: #1d6fb8; --k-brace: #7e3fb0;
  --focus-bg: rgba(181, 86, 47, .13); --parent-line: rgba(181, 86, 47, .45);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #faf7f0; --bg-alt: #f1ecdf; --bg-raised: #ffffff;
  --fg: #2b2620; --fg-dim: #7a7263; --accent: #b5562f; --accent-ink: #fff6ef;
  --border: #ded5bf; --err: #b42318;
  --k-paren: #c2410c; --k-bracket: #1d6fb8; --k-brace: #7e3fb0;
  --focus-bg: rgba(181, 86, 47, .13); --parent-line: rgba(181, 86, 47, .45);
  color-scheme: light;
}

html, body { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-sans);
  display: flex; flex-direction: column; overflow: hidden;
}
.pad { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

header { display: flex; gap: 8px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--border); background: var(--bg-alt); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; }
header h1 span { color: var(--fg-dim); font-weight: 400; }
#case { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 6px; background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
#help-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
#steps { margin: 0; padding-block: 8px; background: var(--bg-alt); border-bottom: 1px solid var(--border); font-size: 13.5px; line-height: 1.45; max-height: 30vh; overflow: auto; }
#steps ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
#steps code { font-family: var(--font-mono); background: var(--bg-raised); padding: 0 4px; border-radius: 4px; }

#log { flex: 1; min-height: 0; overflow: auto; padding-block: 8px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-mono); font-size: 14px; }
.entry { display: grid; gap: 4px; }
.entry .in { display: flex; gap: 8px; align-items: baseline; color: var(--fg-dim); }
.entry .in code { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.entry .in button { background: none; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; padding: 2px 6px; color: var(--fg-dim); font-family: var(--font-sans); }
.entry .out { white-space: pre-wrap; word-break: break-word; padding-left: 10px; border-left: 2px solid var(--border); }
.entry .out.err { color: var(--err); border-left-color: var(--err); }
.entry .use { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 5px 10px; font-family: var(--font-sans); font-size: 13px; }
.sub { font-size: 11px; color: var(--fg-dim); font-family: var(--font-sans); text-transform: uppercase; letter-spacing: .06em; }
.note { color: var(--fg-dim); font-family: var(--font-sans); font-size: 13px; }

/* Shared code rendering: one span per node. */
.code .n { border-radius: 4px; }
.code .dl.p { color: var(--k-paren); } .code .dl.b { color: var(--k-bracket); } .code .dl.c { color: var(--k-brace); }
.code .dl.ghost { opacity: .45; font-style: italic; }
.code .t-str { color: var(--accent); }
.code .kw { color: var(--k-bracket); }
.code .num { color: var(--k-brace); }
.code .t-cmt { color: var(--fg-dim); font-style: italic; }
.code .focus { background: var(--focus-bg); outline: 2px solid var(--accent); outline-offset: 1px; }
.code .parent { box-shadow: 0 2px 0 var(--parent-line); }
.code .pick { background: var(--focus-bg); outline: 2px dashed var(--accent); }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: .85em; white-space: pre; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
.badge.err { background: var(--err); color: var(--bg); }

#editor-wrap { border-top: 1px solid var(--border); background: var(--bg-alt); }
#editor { font-family: var(--font-mono); font-size: 17px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; min-height: 3.4em; max-height: 32vh; overflow: auto; padding-block: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
#editor.root-focus { box-shadow: inset 0 0 0 2px var(--parent-line); }
#editor .empty { color: var(--fg-dim); font-family: var(--font-sans); font-size: 14px; }
#crumbs { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-block: 4px 6px; font-size: 12.5px; white-space: nowrap; scrollbar-width: none; }
#crumbs button { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; font-family: var(--font-mono); }
#crumbs button.cur { border-color: var(--accent); }
#crumbs .kind { color: var(--fg-dim); margin-left: auto; padding-left: 6px; }
#msg { color: var(--accent); }

#bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding-block: 6px; background: var(--bg); border-top: 1px solid var(--border); }
#bar button { min-height: 42px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; line-height: 1.1; padding: 2px; display: grid; place-items: center; }
#bar button b { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
#bar button small { font-size: 10.5px; color: var(--fg-dim); }
#bar button.wide { grid-column: span 2; }
#bar button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#bar button.go small { color: var(--accent-ink); opacity: .8; }
#bar button:active { transform: translateY(1px); }
.wp b { color: var(--k-paren); } .wb b { color: var(--k-bracket); } .wc b { color: var(--k-brace); }

#entry { display: flex; gap: 6px; align-items: center; padding-block: 2px 8px; background: var(--bg); }
#mode { font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
#field { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 16px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--fg); }
#entry button { min-height: 42px; border-radius: 8px; padding: 0 12px; border: 1px solid var(--border); background: var(--bg-raised); }
#run { background: var(--accent) !important; color: var(--accent-ink); border-color: var(--accent) !important; font-weight: 600; }
#run:disabled { opacity: .5; }
</style>

</head>
<body>
<header class="pad">
  <h1>Fennel <span>node editor · spike</span></h1>
  <select id="case" aria-label="Try a case"></select>
  <button id="help-btn" type="button" aria-expanded="true">Steps</button>
</header>
<div id="steps" class="pad"></div>

<div id="log" class="pad" aria-live="polite"></div>

<div id="editor-wrap" class="pad">
  <div id="editor" class="code" aria-label="Structural editor"></div>
  <div id="crumbs"></div>
</div>

<div id="bar" class="pad">
  <button data-op="out" type="button"><b>↑</b><small>out</small></button>
  <button data-op="in" type="button"><b>↓</b><small>in</small></button>
  <button data-op="prev" type="button"><b>◀</b><small>prev</small></button>
  <button data-op="next" type="button"><b>▶</b><small>next</small></button>
  <button data-op="edit" type="button"><b>✎</b><small>edit</small></button>
  <button data-op="del" type="button"><b>⌫</b><small>delete</small></button>

  <button data-op="wrap(" class="wp" type="button"><b>(·)</b><small>wrap</small></button>
  <button data-op="wrap[" class="wb" type="button"><b>[·]</b><small>wrap</small></button>
  <button data-op="wrap{" class="wc" type="button"><b>{·}</b><small>wrap</small></button>
  <button data-op="splice" type="button"><b>·</b><small>splice</small></button>
  <button data-op="raise" type="button"><b>⤴</b><small>raise</small></button>
  <button data-op="copy" type="button"><b>⧉</b><small>copy</small></button>

  <button data-op="slurp" type="button"><b>)⇠</b><small>slurp</small></button>
  <button data-op="barf" type="button"><b>⇢)</b><small>barf</small></button>
  <button data-op="undo" type="button"><b>↶</b><small>undo</small></button>
  <button data-op="eval" class="go wide" type="button"><b>⇒</b><small>eval this form</small></button>
  <button data-op="clear" type="button"><b>∅</b><small>clear</small></button>
</div>

<form id="entry" class="pad" autocomplete="off">
  <span id="mode">after</span>
  <input id="field" type="text" enterkeyhint="enter" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type a form · empty ⏎ steps out" aria-label="Insert text">
  <button id="run" type="button" disabled>Run</button>
</form>

<script src="../pizza-repl-fennel/vendor/fengari-web.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- reader ---
// Tolerant Fennel reader: never throws, unclosed collections are flagged.
const OPEN = { "(": ")", "[": "]", "{": "}" };
const KIND = { "(": "list", "[": "seq", "{": "table" };
const DL = { "(": "p", "[": "b", "{": "c" };
const isColl = (n) => n && (n.t === "list" || n.t === "seq" || n.t === "table");
const DELIM = /[\s()\[\]{}";]/;

function parse(src) {
  const root = { t: "root", s: 0, e: src.length, kids: [], closed: true };
  const stack = [root];
  const top = () => stack[stack.length - 1];
  const add = (n) => { const p = top(); n.parent = p; n.idx = p.kids.length; p.kids.push(n); return n; };
  const done = () => { // a finished form completes any prefix (` ' , #) waiting for it
    while (top().t === "pre" && top().kids.length) { const p = stack.pop(); p.e = p.kids[0].e; }
  };
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === ";") {
      let j = src.indexOf("\n", i); if (j < 0) j = src.length;
      add({ t: "cmt", s: i, e: j, kids: [] }); i = j; continue;
    }
    if (OPEN[c]) {
      const n = add({ t: KIND[c], s: i, e: src.length, open: c, close: OPEN[c], kids: [], closed: false });
      stack.push(n); i++; continue;
    }
    if (c === ")" || c === "]" || c === "}") {
      const at = stack.findLastIndex((n) => n.close === c);
      if (at > 0) {
        while (stack.length > at + 1) stack.pop(); // mismatched inner ones stay unclosed
        const n = stack.pop(); n.e = i + 1; n.closed = true; i++; done();
      } else { add({ t: "atom", s: i, e: i + 1, kids: [], bad: true }); i++; }
      continue;
    }
    if (c === '"') {
      let j = i + 1; let closed = false;
      while (j < src.length) { if (src[j] === "\\") j += 2; else if (src[j] === '"') { closed = true; j++; break; } else j++; }
      j = Math.min(j, src.length);
      add({ t: "str", s: i, e: j, kids: [], closed }); i = j; done(); continue;
    }
    if ("`',#".includes(c) && i + 1 < src.length && !/[\s)\]}]/.test(src[i + 1])) {
      const n = add({ t: "pre", s: i, e: i + 1, kids: [], closed: true }); stack.push(n); i++; continue;
    }
    let j = i + 1; while (j < src.length && !DELIM.test(src[j])) j++;
    add({ t: "atom", s: i, e: j, kids: [] }); i = j; done();
  }
  while (stack.length > 1) { const n = stack.pop(); n.e = src.length; if (n.t === "pre") n.closed = !!n.kids.length; }
  return root;
}

const pathOf = (n) => { const p = []; while (n.parent) { p.unshift(n.idx); n = n.parent; } return p; };
function at(root, path) {
  let n = root;
  for (const i of path) { if (!n.kids.length) break; n = n.kids[Math.max(0, Math.min(i, n.kids.length - 1))]; }
  return n;
}
const forms = (n) => n.kids.filter((k) => k.t !== "cmt");

// ----------------------------------------------------------------- state ---
const S = { src: "", path: [], head: null, replace: false, badge: null, undo: [] };
let tree = parse("");
const $ = (id) => document.getElementById(id);
const editor = $("editor"), field = $("field"), logEl = $("log");

function commit(src, path, keepBadge) {
  if (src !== S.src) S.undo.push({ src: S.src, path: S.path });
  S.src = src; S.path = path; S.head = null; if (!keepBadge) S.badge = null;
  draw();
}
const focusNode = () => at(tree, S.path);
const splice = (s, e, text) => S.src.slice(0, s) + text + S.src.slice(e);
let msgTimer;
function say(m) { const el = $("msg"); if (!el) return; el.textContent = m; clearTimeout(msgTimer); msgTimer = setTimeout(() => (el.textContent = ""), 1800); }

// ------------------------------------------------------------- rendering ---
function kindOf(n) {
  if (n.t === "root") return "top level";
  if (n.t === "list") { const h = forms(n)[0]; return `list ( ) · ${forms(n).length} item${forms(n).length === 1 ? "" : "s"}${h && h.t === "atom" ? " · call " + text(h) : ""}`; }
  if (n.t === "seq") return `sequence [ ] · ${forms(n).length} item${forms(n).length === 1 ? "" : "s"}`;
  if (n.t === "table") return `table { } · ${Math.floor(forms(n).length / 2)} pair${forms(n).length === 2 ? "" : "s"}${forms(n).length % 2 ? " · odd count!" : ""}`;
  if (n.t === "str") return "string";
  if (n.t === "cmt") return "comment";
  if (n.t === "pre") return { "`": "quasiquote", "'": "quote", ",": "unquote", "#": "hashfn" }[S.src[n.s]] || "prefix";
  return atomKind(text(n));
}
function atomKind(t) {
  if (/^-?(\d|\.\d)/.test(t)) return "number";
  if (t[0] === ":" && t.length > 1) return "keyword (string)";
  if (t === "true" || t === "false") return "boolean";
  if (t === "nil") return "nil";
  if (t === ":" || t === "&") return "destructure mark";
  return "symbol";
}
const text = (n, src = S.src) => src.slice(n.s, n.e);
const short = (s, k = 18) => (s.length > k ? s.slice(0, k - 1) + "…" : s);
function label(n) {
  if (n.t === "root") return "top";
  if (isColl(n)) { const h = forms(n)[0]; return n.open + (h ? short(text(h), 10) : "") + (forms(n).length > 1 ? " …" : "") + n.close; }
  return short(text(n).replace(/\s+/g, " "));
}

function renderInto(el, root, src, ctx) {
  ctx.nodes = [];
  const emit = (parent, n, depth) => {
    const sp = document.createElement("span");
    sp.className = "n t-" + n.t;
    sp.dataset.id = ctx.nodes.push(n) - 1;
    if (n.t === "atom") { const k = atomKind(src.slice(n.s, n.e)); if (k === "number") sp.classList.add("num"); else if (k.startsWith("keyword")) sp.classList.add("kw"); }
    if (isColl(n) || n.t === "pre") {
      const head = isColl(n) ? n.open : src[n.s];
      const o = document.createElement("span"); o.className = "dl " + (DL[head] || ""); o.textContent = head; sp.append(o);
      let pos = n.s + 1;
      for (const k of n.kids) { if (k.s > pos) sp.append(src.slice(pos, k.s)); emit(sp, k, depth + 1); pos = k.e; }
      const end = isColl(n) && n.closed ? n.e - 1 : n.e;
      if (end > pos) sp.append(src.slice(pos, end));
      if (isColl(n)) { const c = document.createElement("span"); c.className = "dl " + DL[n.open] + (n.closed ? "" : " ghost"); c.textContent = n.close; sp.append(c); }
    } else sp.textContent = src.slice(n.s, n.e);
    parent.append(sp);
    if (ctx.badge && ctx.badge.node === n) {
      const b = document.createElement("span"); b.className = "badge" + (ctx.badge.err ? " err" : ""); b.textContent = "⇒ " + ctx.badge.text; parent.append(b);
    }
  };
  el.replaceChildren();
  let pos = 0;
  for (const k of root.kids) { if (k.s > pos) el.append(src.slice(pos, k.s)); emit(el, k, 0); pos = k.e; }
  if (src.length > pos) el.append(src.slice(pos));
}

const edCtx = {};
function draw() {
  tree = parse(S.src);
  const f = focusNode();
  S.path = pathOf(f);
  const badge = S.badge && { node: at(tree, S.badge.path), text: S.badge.text, err: S.badge.err };
  edCtx.badge = badge;
  renderInto(editor, tree, S.src, edCtx);
  if (!tree.kids.length) {
    const e = document.createElement("span"); e.className = "empty"; e.textContent = "Empty. Type a form below, e.g. (+ 1 2";
    editor.append(e);
  }
  editor.classList.toggle("root-focus", f === tree);
  const fid = edCtx.nodes.indexOf(f);
  if (fid >= 0) {
    const el = editor.querySelector(`[data-id="${fid}"]`);
    el.classList.add("focus");
    const pid = edCtx.nodes.indexOf(f.parent);
    if (pid >= 0) editor.querySelector(`[data-id="${pid}"]`).classList.add("parent");
    el.scrollIntoView({ block: "nearest" });
  }
  // breadcrumbs
  const chain = []; for (let n = f; n; n = n.parent) chain.unshift(n);
  const crumbs = $("crumbs"); crumbs.replaceChildren();
  chain.forEach((n, i) => {
    if (i) crumbs.append("›");
    const b = document.createElement("button"); b.type = "button"; b.textContent = label(n);
    if (n === f) b.className = "cur";
    b.addEventListener("pointerdown", (e) => e.preventDefault());
    b.addEventListener("click", () => { S.path = pathOf(n); S.head = null; draw(); });
    crumbs.append(b);
  });
  const k = document.createElement("span"); k.className = "kind"; k.innerHTML = `<span id="msg"></span> ${kindOf(f)}`; crumbs.append(k);
  crumbs.scrollLeft = crumbs.scrollWidth;
  $("mode").textContent = S.replace ? "replace" : S.head ? "head of" : (f === tree || (isColl(f) && !forms(f).length)) ? "inside" : "after";
}

// ------------------------------------------------------------ operations ---
function close(fragment) { // auto-close: returns text with missing closers + the path to land on
  const t = parse(fragment);
  let closers = "", chain = [], n = t;
  for (;;) {
    const last = n.kids[n.kids.length - 1];
    if (!last || last.closed !== false) break;
    chain.push(last.idx); n = last;
  }
  for (let m = n; m && m !== t; m = m.parent) closers += m.t === "str" ? '"' : m.close || "";
  if (!t.kids.length) return null;
  let rel;
  if (chain.length) { const deep = n; rel = isColl(deep) && deep.kids.length ? [...chain, deep.kids.length - 1] : chain; }
  else rel = [t.kids.length - 1];
  return { text: fragment + closers, rel };
}

function insert(raw) {
  const frag = raw.trim();
  const f = focusNode();
  if (!frag) { // empty enter: step out, so a typed list can be finished and continued after
    if (S.replace) { S.replace = false; draw(); return; }
    if (f !== tree) { S.path = pathOf(f.parent); S.head = null; draw(); }
    return;
  }
  const c = close(frag); if (!c) return;
  if (S.replace && f !== tree) {
    S.replace = false;
    const base = pathOf(f);
    return commit(splice(f.s, f.e, c.text), [...base.slice(0, -1), base[base.length - 1] + c.rel[0], ...c.rel.slice(1)]);
  }
  S.replace = false;
  if (S.head) { // first slot of a freshly wrapped list
    const list = at(tree, S.head);
    return commit(splice(list.s + 1, list.s + 1, c.text + (forms(list).length ? " " : "")), [...S.head, ...c.rel]);
  }
  if (f === tree) {
    const sep = S.src.trim() ? "\n" : "";
    const src = S.src.replace(/\s+$/, "");
    return commit(src + sep + c.text, [tree.kids.length + c.rel[0], ...c.rel.slice(1)]);
  }
  if (isColl(f) && !forms(f).length) {
    return commit(splice(f.s + 1, f.s + 1, c.text), [...pathOf(f), ...c.rel]);
  }
  const p = pathOf(f);
  const sep = f.parent === tree ? "\n" : " ";
  return commit(splice(f.e, f.e, sep + c.text), [...p.slice(0, -1), p[p.length - 1] + 1 + c.rel[0], ...c.rel.slice(1)]);
}

const ops = {
  out() { const f = focusNode(); if (f !== tree) S.path = pathOf(f.parent); else say("already at top"); draw(); },
  in() { const f = focusNode(); if (f.kids.length) S.path = [...pathOf(f), 0]; else say("no children"); draw(); },
  prev() { sib(-1); }, next() { sib(1); },
  edit() {
    const f = focusNode(); if (f === tree) return say("pick a form first");
    S.replace = true; field.value = text(f); draw(); field.focus(); field.select();
  },
  del() {
    const f = focusNode(); if (f === tree) return;
    let s = f.s, e = f.e;
    const after = S.src.slice(e).match(/^[ \t]*\n?[ \t]*/)[0];
    if (after && f.parent.kids[f.idx + 1]) e += after.length; else s -= S.src.slice(0, s).match(/\s*$/)[0].length;
    const p = pathOf(f), n = f.parent.kids.length - 1;
    const path = n === 0 ? p.slice(0, -1) : [...p.slice(0, -1), Math.min(f.idx, n - 1)];
    commit(splice(s, e, ""), path);
  },
  wrap(o) {
    const f = focusNode(); if (f === tree) return say("pick a form first");
    const p = pathOf(f);
    commit(splice(f.s, f.e, o + text(f) + OPEN[o]), p);
    S.head = p; draw(); say("type the head, or ⏎ empty to keep");
  },
  splice() {
    let f = focusNode(); if (!isColl(f) && f.t !== "pre") f = f.parent;
    if (f === tree) return say("nothing to splice");
    const inner = f.t === "pre" ? text(f.kids[0] || f).replace(/^[`',#]/, "") : S.src.slice(f.s + 1, f.closed ? f.e - 1 : f.e).trim();
    const p = pathOf(f);
    commit(splice(f.s, f.e, inner), inner ? p : p.slice(0, -1));
  },
  raise() {
    const f = focusNode(); if (f === tree || f.parent === tree) return say("already at top");
    const p = pathOf(f.parent);
    commit(splice(f.parent.s, f.parent.e, text(f)), p);
  },
  slurp() {
    const f = focusNode(); const c = isColl(f) ? f : f.parent;
    if (!isColl(c) || !c.closed) return say("not in a list");
    const s = c.parent.kids[c.idx + 1];
    if (!s) return say("nothing after to slurp");
    const body = S.src.slice(c.s, c.e - 1);
    commit(splice(c.s, s.e, body + (c.kids.length ? " " : "") + text(s) + c.close), pathOf(f));
  },
  barf() {
    const f = focusNode(); const c = isColl(f) ? f : f.parent;
    if (!isColl(c) || !c.closed || !c.kids.length) return say("nothing to barf");
    const last = c.kids[c.kids.length - 1];
    const body = S.src.slice(c.s, last.s).replace(/\s+$/, "");
    const cp = pathOf(c);
    const path = f === last ? [...cp.slice(0, -1), cp[cp.length - 1] + 1] : pathOf(f);
    commit(splice(c.s, c.e, body + c.close + " " + text(last)), path);
  },
  copy() {
    const f = focusNode(); const t = f === tree ? S.src : text(f);
    navigator.clipboard?.writeText(t).then(() => say("copied"), () => say("copy blocked here"));
  },
  undo() { const u = S.undo.pop(); if (!u) return say("nothing to undo"); S.src = u.src; S.path = u.path; S.badge = null; S.head = null; draw(); },
  clear() { commit("", []); },
  eval() {
    const f = focusNode(); if (f === tree) return run();
    if (!fennel) return say("Fennel still loading");
    const r = evaluate(text(f));
    const last = r.text.split("\n").filter(Boolean).pop() || "(no value)";
    S.badge = { path: pathOf(f), text: short(last, 40), err: r.isError };
    addLog(text(f), r, true); draw();
  },
};
function sib(d) {
  const f = focusNode(); if (f === tree) return;
  const k = f.idx + d;
  if (k < 0 || k >= f.parent.kids.length) return say(d > 0 ? "last item" : "first item");
  S.path = [...pathOf(f.parent), k]; S.head = null; draw();
}

// ------------------------------------------------------------- the REPL ---
let fennel = null, evaluate = null;
const BOOT = `
local fennel = ...
package.loaded.fennel = fennel
os.getenv = os.getenv or function() return nil end
local out, failed = {}, false
local function emit(text, err) table.insert(out, text); if err then failed = true end end
print = function(...)
  local parts = {}
  for i = 1, select("#", ...) do parts[i] = tostring((select(i, ...))) end
  emit(table.concat(parts, "\\t"))
end
local repl
local function start()
  repl = coroutine.create(function()
    fennel.repl({
      ["error-pinpoint"] = false,
      readChunk = function(parser) return coroutine.yield(parser["stack-size"]) end,
      onValues = function(xs) if #xs > 0 then emit(table.concat(xs, "\\t")) end end,
      onError = function(kind, msg) emit((kind == "Runtime" and "Runtime error: " or "") .. tostring(msg), true) end,
    })
  end)
  assert(coroutine.resume(repl))
end
start()
return function(src)
  out, failed = {}, false
  local ok, depth = coroutine.resume(repl, src .. "\\n")
  if not ok then emit("REPL crashed, restarted: " .. tostring(depth), true); start()
  elseif coroutine.status(repl) == "dead" then emit("(REPL restarted)"); start()
  elseif depth ~= 0 then emit("Incomplete input; REPL restarted.", true); start() end
  return table.concat(out, "\\n"), failed
end`;

async function boot() {
  try {
    const { lua, lauxlib, lualib, to_luastring } = window.fengari;
    const L = lauxlib.luaL_newstate(); lualib.luaL_openlibs(L);
    const check = (st, what) => { if (st !== lua.LUA_OK) throw new Error(what + ": " + lua.lua_tojsstring(L, -1)); };
    const srcText = await (await fetch("../pizza-repl-fennel/vendor/fennel.lua")).text();
    check(lauxlib.luaL_loadbuffer(L, to_luastring(srcText), null, to_luastring("@fennel.lua")), "load fennel");
    check(lua.lua_pcall(L, 0, 1, 0), "run fennel");
    check(lauxlib.luaL_loadstring(L, to_luastring(BOOT)), "load boot");
    lua.lua_insert(L, -2);
    check(lua.lua_pcall(L, 1, 1, 0), "run boot");
    const ref = lauxlib.luaL_ref(L, lua.LUA_REGISTRYINDEX);
    evaluate = (src) => {
      lua.lua_rawgeti(L, lua.LUA_REGISTRYINDEX, ref);
      lua.lua_pushstring(L, to_luastring(src));
      check(lua.lua_pcall(L, 1, 2, 0), "evaluate");
      const r = { text: lua.lua_tojsstring(L, -2), isError: lua.lua_toboolean(L, -1) };
      lua.lua_pop(L, 2); return r;
    };
    fennel = true; $("run").disabled = false;
    note("Fennel 1.6.1 ready. Locals persist between runs, as in the real REPL.");
  } catch (e) { note("Fennel failed to load: " + e.message); }
}

function note(t) { const d = document.createElement("div"); d.className = "note"; d.textContent = t; logEl.append(d); }

function run() {
  if (!fennel) return say("Fennel still loading");
  if (!S.src.trim()) return say("nothing to run");
  if (tree.kids.some(function bad(n) { return n.closed === false || n.bad || n.kids.some(bad); })) return say("unbalanced, fix first");
  const src = S.src;
  addLog(src, evaluate(src), false);
  S.undo.push({ src: S.src, path: S.path });
  S.src = ""; S.path = []; S.badge = null; S.head = null; draw();
}

function addLog(src, r, isPart) {
  const box = document.createElement("div"); box.className = "entry";
  const head = document.createElement("div"); head.className = "in";
  const tag = document.createElement("span"); tag.className = "sub"; tag.textContent = isPart ? "eval" : "run";
  const code = document.createElement("code"); code.textContent = src;
  const again = document.createElement("button"); again.type = "button"; again.textContent = "edit again";
  again.addEventListener("click", () => { commit(src, [0]); });
  head.append(tag, code, again);
  const out = document.createElement("div"); out.className = "out code" + (r.isError ? " err" : "");
  const use = document.createElement("button"); use.type = "button"; use.className = "use"; use.hidden = true;
  if (r.isError || !r.text) out.textContent = r.text || "(no value)";
  else {
    // Values come back in fennel.view syntax, so the same reader makes them a tree:
    // tables and sequences are tappable nodes.
    const t = parse(r.text); const ctx = {};
    renderInto(out, t, r.text, ctx);
    let picked = null;
    out.addEventListener("click", (e) => {
      const el = e.target.closest(".n"); if (!el) return;
      out.querySelectorAll(".pick").forEach((x) => x.classList.remove("pick"));
      const n = ctx.nodes[+el.dataset.id];
      if (picked === n && n.parent && n.parent.t !== "root") { picked = n.parent; }
      else picked = n;
      out.querySelector(`[data-id="${ctx.nodes.indexOf(picked)}"]`).classList.add("pick");
      use.textContent = "Insert " + short(text(picked, r.text), 24) + " into editor";
      use.hidden = false;
    });
    use.addEventListener("pointerdown", (e) => e.preventDefault());
    use.addEventListener("click", () => { if (picked) insert(text(picked, r.text)); });
  }
  box.append(head, out, use);
  logEl.append(box);
  logEl.scrollTop = logEl.scrollHeight;
}

// ------------------------------------------------------------ wiring ---
editor.addEventListener("click", (e) => {
  if (swiped) { swiped = false; return; }
  const el = e.target.closest(".n");
  const n = el ? edCtx.nodes[+el.dataset.id] : tree;
  const f = focusNode();
  S.head = null;
  if (n === f && f !== tree) S.path = pathOf(f.parent); // tap again: widen to the enclosing form
  else S.path = pathOf(n);
  draw();
});
let sx = 0, sy = 0, swiped = false;
editor.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; swiped = false; });
editor.addEventListener("pointerup", (e) => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dy) < 30) { swiped = true; sib(dx < 0 ? 1 : -1); }
});

const bar = $("bar");
bar.addEventListener("pointerdown", (e) => e.preventDefault()); // keep the keyboard up
bar.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-op]"); if (!b) return;
  const op = b.dataset.op;
  if (op.startsWith("wrap")) ops.wrap(op.slice(4)); else ops[op]();
});
$("entry").addEventListener("submit", (e) => { e.preventDefault(); insert(field.value); field.value = ""; });
$("run").addEventListener("pointerdown", (e) => e.preventDefault());
$("run").addEventListener("click", run);

// ------------------------------------------------------------- cases ---
const CASES = [
  { name: "1 · Build a function from nothing", src: "", path: [], steps: [
    "Type <code>(fn sq [n]</code> and press ⏎. You don't type closers: they're added, and the focus lands on <code>[n]</code> inside the <code>fn</code>.",
    "Type <code>(* n n</code> ⏎. It goes after <code>[n]</code>, still inside <code>fn</code>.",
    "Press ⏎ on the empty field twice to step out to the top level. Watch the breadcrumbs.",
    "Type <code>(sq 7</code> ⏎, then tap <b>Run</b>.",
  ] },
  { name: "2 · Eval a piece in place", src: "(+ 1 (* 2 3) (- 10 4))", path: [0], steps: [
    "Tap <code>*</code>, then tap it again: the focus widens to <code>(* 2 3)</code>.",
    "Tap <b>⇒ eval this form</b>. The value appears inline next to it.",
    "Swipe left on the editor (or tap ▶) to reach <code>(- 10 4)</code> and eval it too.",
    "Tap <b>⤴ raise</b>: <code>(- 10 4)</code> replaces the whole <code>+</code> form. Tap <b>↶ undo</b>.",
  ] },
  { name: "3 · Slurp and barf", src: "(+ 1 2) 3 4", path: [0], steps: [
    "The list <code>(+ 1 2)</code> is focused. Tap <b>)⇠ slurp</b> twice: <code>3</code> and <code>4</code> move inside.",
    "Tap <b>⇢) barf</b> once: <code>4</code> moves back out.",
    "Tap <code>2</code> and slurp again. It works from inside the list too.",
    "Focus the list and tap <b>⇒ eval</b>.",
  ] },
  { name: "4 · Wrap, then type the head", src: "(local x 21)\n(print x)", path: [1, 1], steps: [
    "<code>x</code> in the <code>print</code> is focused. Tap <b>(·) wrap</b>. The mode label reads <i>head of</i>.",
    "Type <code>*</code> ⏎ to get <code>(print (* x))</code>.",
    "Tap ▶ to focus <code>x</code>, then type <code>2</code> ⏎.",
    "Tap <b>Run</b>. Then <b>edit again</b> in the log, focus <code>(* x 2)</code>, and try <b>· splice</b>.",
  ] },
  { name: "5 · Tables vs sequences", src: "{:name \"pizza\" :toppings [:basil :mozzarella] :slices 8}", path: [0, 3], steps: [
    "The breadcrumb says <i>sequence [ ] · 2 items</i>. Tap <b>↑</b>: it now says <i>table { } · 3 pairs</i>.",
    "Tap <code>8</code>, tap <b>✎ edit</b>, type <code>12</code> ⏎ (replace mode).",
    "Tap <b>Run</b>. In the log, tap <code>&quot;basil&quot;</code> in the result. Fennel prints keywords back as plain strings. Tap it again to pick the whole sequence.",
    "Tap <b>Insert … into editor</b>. The value comes back as a form you can edit.",
  ] },
  { name: "6 · Loop, then grow the data", src: "(each [_ v (ipairs [1 2 3])] (print (* v v)))", path: [0, 1, 2, 1, 2], steps: [
    "<code>3</code> is focused, deep inside. Read the breadcrumbs.",
    "Type <code>4</code> ⏎ and <code>5</code> ⏎. Each one goes after the last.",
    "Tap <b>Run</b>. The prints show up in the log.",
    "Tap <code>v</code> in <code>(* v v)</code> and eval it alone. You get an honest error, because <code>v</code> is only bound inside the loop.",
  ] },
  { name: "7 · Destructuring let", src: "(let [{: x : y} {:x 1 :y 2}] (+ x y))", path: [0, 1, 0], steps: [
    "<code>{: x : y}</code> is focused: a table pattern. The <code>:</code> marks show up as <i>destructure mark</i>.",
    "Tap ▶ to the value table and eval it. Then tap <b>↑</b> and <b>↑</b> again, and eval the whole <code>let</code>.",
    "Try deleting <code>:y 2</code>: tap <code>2</code> and ⌫, then <code>:y</code> and ⌫. The crumb warns <i>odd count</i> in between.",
  ] },
];
const sel = $("case");
CASES.forEach((c, i) => sel.append(new Option(c.name, i)));
function loadCase(i) {
  const c = CASES[i];
  S.undo = []; S.src = c.src; S.path = c.path; S.badge = null; S.head = null; S.replace = false;
  $("steps").innerHTML = "<ol>" + c.steps.map((s) => `<li>${s}</li>`).join("") + "</ol>";
  draw();
}
sel.addEventListener("change", () => loadCase(+sel.value));
$("help-btn").addEventListener("click", (e) => {
  const st = $("steps"); st.hidden = !st.hidden; e.currentTarget.setAttribute("aria-expanded", String(!st.hidden));
});
loadCase(0);
boot();
</script>
