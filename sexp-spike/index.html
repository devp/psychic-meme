<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Fennel Node Editor</title>
<style>
/* Spike v2. The editor is the file and gets most of the screen. A short log sits above it.
   At the bottom: one row of actions that changes with the focused node, then a fixed nav row
   (← in out → + λ). The text field appears only while typing; nav hides then so the keyboard fits.
   Tokens follow pizza-repl-fennel's theme.css: dark first, plus a light variant. */
:root {
  --bg: #12141a; --bg-alt: #1a1d26; --bg-raised: #20242f;
  --fg: #e4e6ee; --fg-dim: #8a8fa3; --accent: #7dd3a8; --accent-ink: #10241a;
  --border: #2a2e3a; --err: #f07b7b;
  --k-paren: #f2a65a; --k-bracket: #6cb6f5; --k-brace: #c79bf0;
  --focus-bg: rgba(125, 211, 168, .16); --parent-line: rgba(125, 211, 168, .45);
  --scrim: rgba(0, 0, 0, .45);
  --font-mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #faf7f0; --bg-alt: #f1ecdf; --bg-raised: #ffffff;
  --fg: #2b2620; --fg-dim: #7a7263; --accent: #b5562f; --accent-ink: #fff6ef;
  --border: #ded5bf; --err: #b42318;
  --k-paren: #c2410c; --k-bracket: #1d6fb8; --k-brace: #7e3fb0;
  --focus-bg: rgba(181, 86, 47, .13); --parent-line: rgba(181, 86, 47, .45);
  --scrim: rgba(43, 38, 32, .3);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #faf7f0; --bg-alt: #f1ecdf; --bg-raised: #ffffff;
  --fg: #2b2620; --fg-dim: #7a7263; --accent: #b5562f; --accent-ink: #fff6ef;
  --border: #ded5bf; --err: #b42318;
  --k-paren: #c2410c; --k-bracket: #1d6fb8; --k-brace: #7e3fb0;
  --focus-bg: rgba(181, 86, 47, .13); --parent-line: rgba(181, 86, 47, .45);
  --scrim: rgba(43, 38, 32, .3);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; height: var(--app-height, 100%); overflow: hidden;
  background: var(--bg); color: var(--fg); font: 14px var(--font-sans);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.pad { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

header { display: flex; gap: 6px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--border); background: var(--bg-alt); }
header h1 { font-size: 14px; margin: 0; font-weight: 650; white-space: nowrap; }
.grow { flex: 1; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 12px; font-size: 13px; color: var(--fg-dim); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* REPL view: same interpreter and log, the file is put away. */
body.view-repl #editor-wrap, body.view-repl #ctx, body.view-repl #nav, body.view-repl #entry { display: none !important; }
body:not(.view-repl) #repl-line { display: none; }
body.view-repl #log { flex: 1 1 auto; max-height: none; display: flex; border-bottom: 0; }
#repl-line { display: flex; gap: 6px; align-items: center; padding-block: 6px max(8px, env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--border); }
#repl-field { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--fg); }
#repl-line button { min-height: 40px; min-width: 40px; border-radius: 8px; padding: 0 10px; border: 1px solid var(--border); background: var(--bg-raised); }
.entry .in button { background: none; border: 1px solid var(--border); border-radius: 5px; font-size: 11.5px; padding: 1px 6px; color: var(--fg-dim); font-family: var(--font-sans); white-space: nowrap; }
.badge.stale { opacity: .45; text-decoration: line-through; }
#case-grid { margin-bottom: 14px; }
#case-grid button[aria-current="true"] { border-color: var(--accent); }
.hbtn { background: none; border: 1px solid var(--border); border-radius: 6px; min-width: 34px; height: 30px; padding: 0 8px; }

#log { flex: 0 1 auto; max-height: 26%; overflow: auto; padding-block: 6px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-mono); font-size: 13px; border-bottom: 1px solid var(--border); }
#log:empty { display: none; }
body.typing #log { display: none; }
.entry { display: grid; gap: 3px; }
.entry .in { display: flex; gap: 8px; align-items: baseline; color: var(--fg-dim); }
.entry .in code { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.entry .out { white-space: pre-wrap; word-break: break-word; padding-left: 8px; border-left: 2px solid var(--border); }
.entry .out.err { color: var(--err); border-left-color: var(--err); }
.entry .use { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 4px 10px; font-family: var(--font-sans); font-size: 13px; }
.sub { font-size: 10.5px; color: var(--fg-dim); font-family: var(--font-sans); text-transform: uppercase; letter-spacing: .06em; }
.note { color: var(--fg-dim); font-family: var(--font-sans); font-size: 12.5px; }

/* Shared code rendering: one span per node. */
.code .n { border-radius: 4px; }
.code .dl.p { color: var(--k-paren); } .code .dl.b { color: var(--k-bracket); } .code .dl.c { color: var(--k-brace); }
.code .dl.ghost { opacity: .45; font-style: italic; }
.code .t-str { color: var(--accent); }
.code .kw { color: var(--k-bracket); }
.code .num { color: var(--k-brace); }
.code .t-cmt { color: var(--fg-dim); font-style: italic; }
.code .hole { border: 1.5px dashed var(--fg-dim); color: var(--fg-dim); font-style: italic; padding: 0 4px; font-size: .85em; }
.code .focus { background: var(--focus-bg); outline: 2px solid var(--accent); outline-offset: 1px; }
.code .hole.focus { border-color: var(--accent); color: var(--fg); }
.code .parent { box-shadow: 0 2px 0 var(--parent-line); }
.code .pick { background: var(--focus-bg); outline: 2px dashed var(--accent); }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: .8em; white-space: pre; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
.badge.err { background: var(--err); color: var(--bg); }

#editor-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg-alt); }
#editor { flex: 1 1 auto; min-height: 0; overflow: auto; font-family: var(--font-mono); font-size: 17px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; padding-block: 10px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
#editor.root-focus { box-shadow: inset 0 0 0 2px var(--parent-line); }
#editor .empty { color: var(--fg-dim); font-family: var(--font-sans); font-size: 14px; }
#crumbs { display: flex; gap: 5px; align-items: center; overflow-x: auto; padding-block: 4px; font-size: 12px; white-space: nowrap; scrollbar-width: none; border-top: 1px solid var(--border); }
#crumbs button { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; padding: 1px 8px; font-family: var(--font-mono); }
#crumbs button.cur { border-color: var(--accent); }
#crumbs .kind { color: var(--fg-dim); margin-left: auto; padding-left: 6px; }
#msg { color: var(--accent); }

#entry { display: flex; gap: 6px; align-items: center; padding-block: 6px; background: var(--bg); border-top: 1px solid var(--border); }
#mode { font-size: 11.5px; color: var(--fg-dim); max-width: 26%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#field { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--bg-raised); color: var(--fg); }
#entry button { min-height: 40px; min-width: 40px; border-radius: 8px; padding: 0 10px; border: 1px solid var(--border); background: var(--bg-raised); }

.row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding-block: 5px; background: var(--bg); }
#ctx { border-top: 1px solid var(--border); }
#nav { padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
body.typing #ctx, body.typing #nav { display: none; }
.row button { min-height: 44px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 9px; padding: 2px; display: grid; place-items: center; line-height: 1.05; }
.row button b { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
.row button small { font-size: 10.5px; color: var(--fg-dim); }
.row button.go b { color: var(--accent); }
.row button:active { transform: translateY(1px); }
#nav button.navk { background: var(--bg-alt); }

#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 5; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg-alt); border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; padding-block: 12px max(14px, env(safe-area-inset-bottom, 0px)); max-height: 70%; overflow: auto; }
.sheet h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-dim); margin: 0 0 8px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.grid button { min-height: 44px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 9px; padding: 6px; text-align: left; }
.grid button b { display: block; font-family: var(--font-mono); font-size: 14px; }
.grid button small { color: var(--fg-dim); font-size: 11px; font-family: var(--font-mono); word-break: break-word; }
#steps-sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; line-height: 1.45; }
#steps-sheet code { font-family: var(--font-mono); background: var(--bg-raised); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<header class="pad">
  <h1>fnl·node</h1>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="file" aria-pressed="true">file</button>
    <button type="button" data-view="repl" aria-pressed="false">repl</button>
  </div>
  <span class="grow"></span>
  <button id="undo-btn" class="hbtn" type="button" aria-label="Undo">↶</button>
  <button id="steps-btn" class="hbtn" type="button" aria-label="Steps for this case">?</button>
</header>

<div id="log" class="pad" aria-live="polite"></div>

<div id="editor-wrap" class="pad">
  <div id="editor" class="code" aria-label="File"></div>
  <div id="crumbs"></div>
</div>

<form id="entry" class="pad" autocomplete="off" hidden>
  <span id="mode">after</span>
  <input id="field" type="text" enterkeyhint="enter" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type a form">
  <button id="tpl-key" type="button" aria-label="Templates">λ</button>
  <button id="done" type="button">done</button>
</form>

<div id="ctx" class="row pad"></div>
<div id="nav" class="row pad">
  <button class="navk" data-op="prev" type="button"><b>←</b><small>prev</small></button>
  <button class="navk" data-op="in" type="button"><b>↓</b><small>in</small></button>
  <button class="navk" data-op="out" type="button"><b>↑</b><small>out</small></button>
  <button class="navk" data-op="next" type="button"><b>→</b><small>next</small></button>
  <button data-op="add" type="button"><b>+</b><small>add</small></button>
  <button data-op="tpl" type="button"><b>λ</b><small>template</small></button>
</div>

<form id="repl-line" class="pad" autocomplete="off">
  <button id="restart-btn" type="button" aria-label="Restart REPL" title="Restart REPL">↻</button>
  <input id="repl-field" type="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="scratch: (+ 1 2" aria-label="REPL line">
  <button type="submit">run</button>
</form>

<div id="scrim" hidden></div>
<div id="more-sheet" class="sheet pad" hidden><h2>All actions</h2><div class="grid" id="more-grid"></div></div>
<div id="tpl-sheet" class="sheet pad" hidden><h2>Templates · fill the ▢ holes; ▢…  holes repeat until an empty ⏎</h2><div class="grid" id="tpl-grid"></div></div>
<div id="steps-sheet" class="sheet pad" hidden><h2>Cases</h2><div class="grid" id="case-grid"></div><h2 id="steps-title">Steps</h2><div id="steps"></div></div>

<script src="../pizza-repl-fennel/vendor/fengari-web.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- reader ---
// Tolerant Fennel reader: never throws, unclosed collections are flagged.
const OPEN = { "(": ")", "[": "]", "{": "}" };
const KIND = { "(": "list", "[": "seq", "{": "table" };
const DL = { "(": "p", "[": "b", "{": "c" };
const HOLE = "▢";
const isColl = (n) => n && (n.t === "list" || n.t === "seq" || n.t === "table");
const DELIM = /[\s()\[\]{}";]/;

function parse(src) {
  const root = { t: "root", s: 0, e: src.length, kids: [], closed: true };
  const stack = [root];
  const top = () => stack[stack.length - 1];
  const add = (n) => { const p = top(); n.parent = p; n.idx = p.kids.length; p.kids.push(n); return n; };
  const done = () => { // a finished form completes any prefix (` ' , #) waiting for it
    while (top().t === "pre" && top().kids.length) { const p = stack.pop(); p.e = p.kids[0].e; }
  };
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === ";") {
      let j = src.indexOf("\n", i); if (j < 0) j = src.length;
      add({ t: "cmt", s: i, e: j, kids: [] }); i = j; continue;
    }
    if (OPEN[c]) {
      const n = add({ t: KIND[c], s: i, e: src.length, open: c, close: OPEN[c], kids: [], closed: false });
      stack.push(n); i++; continue;
    }
    if (c === ")" || c === "]" || c === "}") {
      const at = stack.findLastIndex((n) => n.close === c);
      if (at > 0) {
        while (stack.length > at + 1) stack.pop(); // mismatched inner ones stay unclosed
        const n = stack.pop(); n.e = i + 1; n.closed = true; i++; done();
      } else { add({ t: "atom", s: i, e: i + 1, kids: [], bad: true }); i++; }
      continue;
    }
    if (c === '"') {
      let j = i + 1; let closed = false;
      while (j < src.length) { if (src[j] === "\\") j += 2; else if (src[j] === '"') { closed = true; j++; break; } else j++; }
      j = Math.min(j, src.length);
      add({ t: "str", s: i, e: j, kids: [], closed }); i = j; done(); continue;
    }
    if ("`',#".includes(c) && i + 1 < src.length && !/[\s)\]}]/.test(src[i + 1])) {
      const n = add({ t: "pre", s: i, e: i + 1, kids: [], closed: true }); stack.push(n); i++; continue;
    }
    let j = i + 1; while (j < src.length && !DELIM.test(src[j])) j++;
    add({ t: "atom", s: i, e: j, kids: [] }); i = j; done();
  }
  while (stack.length > 1) { const n = stack.pop(); n.e = src.length; if (n.t === "pre") n.closed = !!n.kids.length; }
  return root;
}

const pathOf = (n) => { const p = []; while (n.parent) { p.unshift(n.idx); n = n.parent; } return p; };
function at(root, path) {
  let n = root;
  for (const i of path) { if (!n.kids.length) break; n = n.kids[Math.max(0, Math.min(i, n.kids.length - 1))]; }
  return n;
}
const forms = (n) => n.kids.filter((k) => k.t !== "cmt");
function walk(n, f) { f(n); n.kids.forEach((k) => walk(k, f)); }
const isHole = (n, src = S.src) => n.t === "atom" && src.startsWith(HOLE, n.s);
const isRep = (n) => isHole(n) && S.src[n.e - 1] === "…"; // repeating: stays until an empty ⏎
const headOf = (src) => { const k = parse(src).kids[0]; return k && isColl(k) && k.kids[0] ? src.slice(k.kids[0].s, k.kids[0].e) : null; };
const stripRep = (src) => src.replace(/\s*▢[^\s()\[\]{}";]*…/g, "");
function holes(root) { const hs = []; walk(root, (n) => { if (isHole(n)) hs.push(n); }); return hs; }

// ----------------------------------------------------------------- state ---
// mode: null (not typing) | "add" | "edit" | "fill"
const S = { src: "", path: [], head: null, mode: null, badges: {}, undo: [], view: "file" };
let tree = parse("");
const $ = (id) => document.getElementById(id);
const editor = $("editor"), field = $("field"), logEl = $("log");

function commit(src, path) {
  if (src !== S.src) S.undo.push({ src: S.src, path: S.path });
  S.src = src; S.path = path; S.head = null;
  draw();
}
const focusNode = () => at(tree, S.path);
const splice = (s, e, text) => S.src.slice(0, s) + text + S.src.slice(e);
let msgTimer;
function say(m) { const el = $("msg"); if (!el) return; el.textContent = m; clearTimeout(msgTimer); msgTimer = setTimeout(() => (el.textContent = ""), 2000); }

// ------------------------------------------------------------- rendering ---
function kindOf(n) {
  if (n.t === "root") return "file";
  const k = forms(n).length;
  if (n.t === "list") { const h = forms(n)[0]; return `list · ${k}${h && h.t === "atom" ? " · " + text(h) : ""}`; }
  if (n.t === "seq") return `sequence [ ] · ${k}`;
  if (n.t === "table") return `table { } · ${Math.floor(k / 2)} pair${k === 2 ? "" : "s"}${k % 2 ? " · odd!" : ""}`;
  if (n.t === "str") return "string";
  if (n.t === "cmt") return "comment";
  if (n.t === "pre") return { "`": "quasiquote", "'": "quote", ",": "unquote", "#": "hashfn" }[S.src[n.s]] || "prefix";
  if (isHole(n)) return "hole · " + (text(n).slice(1) || "form");
  return atomKind(text(n));
}
function atomKind(t) {
  if (/^-?(\d|\.\d)/.test(t)) return "number";
  if (t[0] === ":" && t.length > 1) return "keyword";
  if (t === "true" || t === "false") return "boolean";
  if (t === "nil") return "nil";
  if (t === ":" || t === "&") return "destructure mark";
  return "symbol";
}
const text = (n, src = S.src) => src.slice(n.s, n.e);
const short = (s, k = 18) => (s.length > k ? s.slice(0, k - 1) + "…" : s);
function label(n) {
  if (n.t === "root") return "file";
  if (isColl(n)) { const h = forms(n)[0]; return n.open + (h ? short(text(h), 10) : "") + (forms(n).length > 1 ? " …" : "") + n.close; }
  return short(text(n).replace(/\s+/g, " "));
}

function renderInto(el, root, src, ctx) {
  ctx.nodes = [];
  const emit = (parent, n) => {
    const sp = document.createElement("span");
    sp.className = "n t-" + n.t;
    sp.dataset.id = ctx.nodes.push(n) - 1;
    if (n.t === "atom") {
      const t = src.slice(n.s, n.e);
      if (t.startsWith(HOLE)) sp.classList.add("hole");
      else { const k = atomKind(t); if (k === "number") sp.classList.add("num"); else if (k === "keyword") sp.classList.add("kw"); }
    }
    if (isColl(n) || n.t === "pre") {
      const head = isColl(n) ? n.open : src[n.s];
      const o = document.createElement("span"); o.className = "dl " + (DL[head] || ""); o.textContent = head; sp.append(o);
      let pos = n.s + 1;
      for (const k of n.kids) { if (k.s > pos) sp.append(src.slice(pos, k.s)); emit(sp, k); pos = k.e; }
      const end = isColl(n) && n.closed ? n.e - 1 : n.e;
      if (end > pos) sp.append(src.slice(pos, end));
      if (isColl(n)) { const c = document.createElement("span"); c.className = "dl " + DL[n.open] + (n.closed ? "" : " ghost"); c.textContent = n.close; sp.append(c); }
    } else if (sp.classList.contains("hole")) sp.textContent = src.slice(n.s + 1, n.e) || "form";
    else sp.textContent = src.slice(n.s, n.e);
    parent.append(sp);
    const bd = ctx.badgeFor && ctx.badgeFor(n);
    if (bd) {
      const b = document.createElement("span"); b.className = "badge" + (bd.err ? " err" : "") + (bd.stale ? " stale" : "");
      b.textContent = "⇒ " + bd.text; parent.append(b);
    }
  };
  el.replaceChildren();
  let pos = 0;
  for (const k of root.kids) { if (k.s > pos) el.append(src.slice(pos, k.s)); emit(el, k); pos = k.e; }
  if (src.length > pos) el.append(src.slice(pos));
}

// The action row: only what applies to the focused node, most useful first.
const ACT = {
  eval: ["⇒", "eval"], evalAll: ["⇒", "eval file"], evalFresh: ["↻⇒", "eval fresh"], restart: ["↻", "restart REPL"], edit: ["✎", "edit"], fill: ["✎", "fill"],
  "wrap(": ["(·)", "wrap"], "wrap[": ["[·]", "wrap"], "wrap{": ["{·}", "wrap"],
  glom: [")⇠", "glom"], yeet: ["⇢)", "yeet"], splice: ["·", "splice"], raise: ["⤴", "raise"],
  del: ["⌫", "delete"], copy: ["⧉", "copy"], clear: ["∅", "clear file"], more: ["⋯", "more"],
};
function actionsFor(f) {
  if (f === tree) return ["evalAll", "evalFresh", "copy"];
  if (isHole(f)) return ["fill", "del"];
  const nested = f.parent !== tree;
  const inColl = isColl(f) || isColl(f.parent);
  const a = isColl(f) ? ["eval", "glom", "yeet", "wrap(", "del"] : ["eval", "edit", "wrap(", "del"];
  if (!isColl(f) && inColl) a.splice(3, 0, "glom");
  if (nested && a.length < 5) a.push("raise");
  return a;
}
function buildCtx(f) {
  const row = $("ctx"); row.replaceChildren();
  const list = actionsFor(f).slice(0, 5);
  for (const op of [...list, "more"]) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.op = op;
    if (op === "eval" || op === "evalAll") b.className = "go";
    b.innerHTML = `<b>${ACT[op][0]}</b><small>${ACT[op][1]}</small>`;
    row.append(b);
  }
}

const edCtx = {};
function draw() {
  tree = parse(S.src);
  const f = focusNode();
  S.path = pathOf(f);
  edCtx.badgeFor = (n) => {
    const b = S.badges[pathOf(n).join(",")];
    if (!b) return null;
    if (text(n) === b.src) return b;
    // edited since: show it struck through, unless a different form now sits in this spot
    return headOf(text(n)) === headOf(b.src) ? { text: b.text, err: b.err, stale: true } : null;
  };
  renderInto(editor, tree, S.src, edCtx);
  if (!tree.kids.length) {
    const e = document.createElement("span"); e.className = "empty"; e.textContent = "Empty file. Tap + add, or λ for a template.";
    editor.append(e);
  }
  editor.classList.toggle("root-focus", f === tree);
  const fid = edCtx.nodes.indexOf(f);
  if (fid >= 0) {
    const el = editor.querySelector(`[data-id="${fid}"]`);
    el.classList.add("focus");
    const pid = edCtx.nodes.indexOf(f.parent);
    if (pid >= 0) editor.querySelector(`[data-id="${pid}"]`).classList.add("parent");
    el.scrollIntoView({ block: "nearest" });
  }
  const chain = []; for (let n = f; n; n = n.parent) chain.unshift(n);
  const crumbs = $("crumbs"); crumbs.replaceChildren();
  chain.forEach((n, i) => {
    if (i) crumbs.append("›");
    const b = document.createElement("button"); b.type = "button"; b.textContent = label(n);
    if (n === f) b.className = "cur";
    b.addEventListener("click", () => { S.path = pathOf(n); S.head = null; draw(); });
    crumbs.append(b);
  });
  const k = document.createElement("span"); k.className = "kind"; k.innerHTML = `<span id="msg"></span> ${kindOf(f)}`; crumbs.append(k);
  crumbs.scrollLeft = crumbs.scrollWidth;
  buildCtx(f);
  document.body.classList.toggle("typing", !!S.mode);
  $("entry").hidden = !S.mode;
  $("mode").textContent =
    S.mode === "edit" ? "replace" :
    S.mode === "fill" ? "fill " + (text(f).slice(1) || "▢") :
    S.head ? "head of" : (f === tree || (isColl(f) && !forms(f).length)) ? "inside" : "after";
  field.placeholder = S.mode !== "fill" ? "⏎ empty steps out" : isRep(f) ? "one at a time · empty ⏎ = done" : "⏎ empty skips this hole";
}

// ------------------------------------------------------------ typing ---
function openEntry(mode, value = "") {
  S.mode = mode; field.value = value; draw();
  field.focus(); if (value) field.select();
}
function closeEntry() { S.mode = null; S.head = null; field.blur(); draw(); }

function close(fragment) { // auto-close: text with missing closers + the relative path to land on
  const t = parse(fragment);
  let closers = "", chain = [], n = t;
  for (;;) {
    const last = n.kids[n.kids.length - 1];
    if (!last || last.closed !== false) break;
    chain.push(last.idx); n = last;
  }
  for (let m = n; m && m !== t; m = m.parent) closers += m.t === "str" ? '"' : m.close || "";
  if (!t.kids.length) return null;
  let rel;
  if (chain.length) rel = isColl(n) && n.kids.length ? [...chain, n.kids.length - 1] : chain;
  else rel = [t.kids.length - 1];
  return { text: fragment + closers, rel };
}

// Insert text relative to the focus. Returns the inserted form's path, for templates.
function insertText(c) {
  const f = focusNode();
  const shift = (base) => [...base.slice(0, -1), base[base.length - 1] + c.rel[0], ...c.rel.slice(1)];
  if (S.head) {
    const list = at(tree, S.head), head = S.head;
    commit(splice(list.s + 1, list.s + 1, c.text + (forms(list).length ? " " : "")), [...head, ...c.rel]);
    return [...head, c.rel[0]];
  }
  if (f === tree) {
    const src = S.src.replace(/\s+$/, ""), sep = src ? "\n" : "", k = tree.kids.length;
    commit(src + sep + c.text, shift([k]));
    return [k + c.rel[0]];
  }
  if (isColl(f) && !forms(f).length) {
    const p = pathOf(f);
    commit(splice(f.s + 1, f.s + 1, c.text), [...p, ...c.rel]);
    return [...p, c.rel[0]];
  }
  const p = pathOf(f), sep = f.parent === tree ? "\n" : " ";
  const base = [...p.slice(0, -1), p[p.length - 1] + 1];
  commit(splice(f.e, f.e, sep + c.text), shift(base));
  return [...p.slice(0, -1), p[p.length - 1] + 1 + c.rel[0]];
}

function submit(raw) {
  const frag = raw.trim();
  const f = focusNode();
  if (S.mode === "fill") return fill(frag);
  if (!frag) { // empty enter: step out, so a typed list can be finished and continued after
    if (S.mode === "edit") { S.mode = "add"; draw(); return; }
    if (S.head) { S.head = null; draw(); return; }
    if (f !== tree) { S.path = pathOf(f.parent); S.head = null; draw(); }
    return;
  }
  const c = close(frag); if (!c) return;
  if (S.mode === "edit" && f !== tree) {
    S.mode = "add";
    const base = pathOf(f);
    return commit(splice(f.s, f.e, c.text), [...base.slice(0, -1), base[base.length - 1] + c.rel[0], ...c.rel.slice(1)]);
  }
  insertText(c);
}

// Holes: fill the focused one, then jump to the next hole after it (inside the template first).
function fill(frag) {
  const h = focusNode();
  const p = pathOf(h);
  let from = h.e;
  if (frag) {
    const c = close(frag); if (!c) return;
    if (isRep(h)) { // add before the hole and stay on it
      const n = parse(c.text).kids.length;
      return commit(splice(h.s, h.s, c.text + " "), [...p.slice(0, -1), p[p.length - 1] + n]);
    }
    commit(splice(h.s, h.e, c.text), p);
    from = h.s + c.text.length;
  } else if (isRep(h)) { // empty ⏎ ends a repeating hole: drop it
    const s0 = h.s - S.src.slice(0, h.s).match(/\s*$/)[0].length;
    commit(splice(s0, h.e, ""), p);
    from = s0;
  }
  // next hole in the same top-level form: after this one, else wrap around
  const topIdx = pathOf(h)[0];
  const scope = tree.kids[topIdx];
  const next = holes(scope).find((n) => n.s >= from) || holes(scope).find((n) => n.s < h.s);
  if (next) { S.path = pathOf(next); draw(); return; }
  // all filled: land on the top-level form and keep typing after it
  S.path = [topIdx]; S.mode = "add"; draw(); say("holes filled");
}

function insertTemplate(t) {
  const c = close(t.code);
  const f = focusNode();
  let p;
  if (S.mode === "fill" && isRep(f)) { p = pathOf(f); commit(splice(f.s, f.s, c.text + " "), p); } // goes before a repeating hole
  else if (S.mode === "fill" && isHole(f)) { p = pathOf(f); commit(splice(f.s, f.e, c.text), p); } // a template can fill a hole
  else p = insertText(c);
  const first = holes(at(tree, p))[0];
  if (first) { S.path = pathOf(first); openEntry("fill"); }
}

// ------------------------------------------------------------ operations ---
const ops = {
  out() { const f = focusNode(); if (f !== tree) S.path = pathOf(f.parent); else say("at the file"); S.head = null; draw(); },
  in() { const f = focusNode(); if (f.kids.length) S.path = [...pathOf(f), 0]; else say("no children"); S.head = null; draw(); },
  prev() { sib(-1); }, next() { sib(1); },
  add() { openEntry("add"); },
  tpl() { openSheet("tpl-sheet"); },
  more() { openSheet("more-sheet"); },
  edit() { const f = focusNode(); if (f === tree) return; if (isHole(f)) return openEntry("fill"); openEntry("edit", text(f)); },
  fill() { openEntry("fill"); },
  del() {
    const f = focusNode(); if (f === tree) return;
    let s = f.s, e = f.e;
    const after = S.src.slice(e).match(/^[ \t]*\n?[ \t]*/)[0];
    if (after && f.parent.kids[f.idx + 1]) e += after.length; else s -= S.src.slice(0, s).match(/\s*$/)[0].length;
    const p = pathOf(f), n = f.parent.kids.length - 1;
    const path = n === 0 ? p.slice(0, -1) : [...p.slice(0, -1), Math.min(f.idx, n - 1)];
    commit(splice(s, e, ""), path);
  },
  wrap(o) {
    const f = focusNode(); if (f === tree) return say("pick a form first");
    const p = pathOf(f);
    commit(splice(f.s, f.e, o + text(f) + OPEN[o]), p);
    S.head = p; draw(); say("+ add types the head");
  },
  splice() {
    let f = focusNode(); if (!isColl(f) && f.t !== "pre") f = f.parent;
    if (f === tree) return say("nothing to splice");
    const inner = f.t === "pre" ? text(f.kids[0] || f).replace(/^[`',#]/, "") : S.src.slice(f.s + 1, f.closed ? f.e - 1 : f.e).trim();
    const p = pathOf(f);
    commit(splice(f.s, f.e, inner), inner ? p : p.slice(0, -1));
  },
  raise() {
    const f = focusNode(); if (f === tree || f.parent === tree) return say("already at top");
    commit(splice(f.parent.s, f.parent.e, text(f)), pathOf(f.parent));
  },
  glom() { // slurp: pull the next sibling into the list
    const f = focusNode(); const c = isColl(f) ? f : f.parent;
    if (!isColl(c) || !c.closed) return say("not in a list");
    const s = c.parent.kids[c.idx + 1];
    if (!s) return say("nothing after to glom");
    commit(splice(c.s, s.e, S.src.slice(c.s, c.e - 1) + (c.kids.length ? " " : "") + text(s) + c.close), pathOf(f));
  },
  yeet() { // barf: push the last item out of the list
    const f = focusNode(); const c = isColl(f) ? f : f.parent;
    if (!isColl(c) || !c.closed || !c.kids.length) return say("nothing to yeet");
    const last = c.kids[c.kids.length - 1];
    const body = S.src.slice(c.s, last.s).replace(/\s+$/, "");
    const cp = pathOf(c);
    const path = f === last ? [...cp.slice(0, -1), cp[cp.length - 1] + 1] : pathOf(f);
    commit(splice(c.s, c.e, body + c.close + " " + text(last)), path);
  },
  copy() {
    const f = focusNode(); const t = f === tree ? S.src : text(f);
    navigator.clipboard?.writeText(t).then(() => say("copied"), () => say("copy blocked here"));
  },
  undo() { const u = S.undo.pop(); if (!u) return say("nothing to undo"); S.src = u.src; S.path = u.path; S.head = null; draw(); },
  clear() { commit("", []); },
  eval() { evalNode(focusNode()); },
  evalAll() { evalFile(false); },
  evalFresh() { evalFile(true); },
  restart() { restart(); },
};
for (const o of "([{") ops["wrap" + o] = () => ops.wrap(o);
function sib(d) {
  const f = focusNode(); if (f === tree) return;
  const k = f.idx + d;
  if (k < 0 || k >= f.parent.kids.length) return say(d > 0 ? "last item" : "first item");
  S.path = [...pathOf(f.parent), k]; S.head = null; draw();
}

// ------------------------------------------------------------- sheets ---
const SHEETS = ["more-sheet", "tpl-sheet", "steps-sheet"];
function openSheet(id) { SHEETS.forEach((s) => ($(s).hidden = s !== id)); $("scrim").hidden = false; }
function closeSheets() { SHEETS.forEach((s) => ($(s).hidden = true)); $("scrim").hidden = true; }
$("scrim").addEventListener("click", closeSheets);

const MORE = ["eval", "edit", "wrap(", "wrap[", "wrap{", "glom", "yeet", "splice", "raise", "del", "copy", "evalAll", "evalFresh", "restart", "clear"];
for (const op of MORE) {
  const b = document.createElement("button"); b.type = "button";
  b.innerHTML = `<b>${ACT[op][0]}</b><small>${ACT[op][1]}</small>`;
  b.addEventListener("click", () => { closeSheets(); ops[op](); });

}

// Templates: ▢name marks a hole; the word after ▢ is its hint.
const TEMPLATES = [
  { name: "fn", code: "(fn ▢name [▢args…] ▢body…)" },
  { name: "λ", code: "(λ ▢name [▢args…] ▢body…)" },
  { name: "#( $ )", code: "#(▢body $)" },

// ------------------------------------------------------------- the REPL ---
let fennel = null, evaluate = null;
const BOOT = `
local fennel = ...
package.loaded.fennel = fennel
os.getenv = os.getenv or function() return nil end
local out, failed = {}, false
local function emit(text, err) table.insert(out, text); if err then failed = true end end
print = function(...)
  local parts = {}
  for i = 1, select("#", ...) do parts[i] = tostring((select(i, ...))) end
  emit(table.concat(parts, "\\t"))
end
local repl
local function start()
  repl = coroutine.create(function()
    fennel.repl({
      ["error-pinpoint"] = false,
      readChunk = function(parser) return coroutine.yield(parser["stack-size"]) end,
      onValues = function(xs) if #xs > 0 then emit(table.concat(xs, "\\t")) end end,
      onError = function(kind, msg) emit((kind == "Runtime" and "Runtime error: " or "") .. tostring(msg), true) end,
    })
  end)
  assert(coroutine.resume(repl))
end
start()
return function(src)
  if src == nil then start(); return "", false end
  out, failed = {}, false
  local ok, depth = coroutine.resume(repl, src .. "\\n")
  if not ok then emit("REPL crashed, restarted: " .. tostring(depth), true); start()
  elseif coroutine.status(repl) == "dead" then emit("(REPL restarted)"); start()
  elseif depth ~= 0 then emit("Incomplete input; REPL restarted.", true); start() end
  return table.concat(out, "\\n"), failed
end`;

async function boot() {
  try {
    const { lua, lauxlib, lualib, to_luastring } = window.fengari;
    const L = lauxlib.luaL_newstate(); lualib.luaL_openlibs(L);
    const check = (st, what) => { if (st !== lua.LUA_OK) throw new Error(what + ": " + lua.lua_tojsstring(L, -1)); };
    const srcText = await (await fetch("../pizza-repl-fennel/vendor/fennel.lua")).text();
    check(lauxlib.luaL_loadbuffer(L, to_luastring(srcText), null, to_luastring("@fennel.lua")), "load fennel");
    check(lua.lua_pcall(L, 0, 1, 0), "run fennel");
    check(lauxlib.luaL_loadstring(L, to_luastring(BOOT)), "load boot");
    lua.lua_insert(L, -2);
    check(lua.lua_pcall(L, 1, 1, 0), "run boot");
    const ref = lauxlib.luaL_ref(L, lua.LUA_REGISTRYINDEX);
    evaluate = (src) => { // null restarts the REPL
      lua.lua_rawgeti(L, lua.LUA_REGISTRYINDEX, ref);
      if (src === null) lua.lua_pushnil(L); else lua.lua_pushstring(L, to_luastring(src));
      check(lua.lua_pcall(L, 1, 2, 0), "evaluate");
      const r = { text: lua.lua_tojsstring(L, -2), isError: lua.lua_toboolean(L, -1) };
      lua.lua_pop(L, 2); return r;
    };
    fennel = true;
    note("Fennel 1.6.1 ready. Eval keeps the file; locals persist between evals.");
  } catch (e) { note("Fennel failed to load: " + e.message); }
}

function note(t) { const d = document.createElement("div"); d.className = "note"; d.textContent = t; logEl.append(d); }

// Eval never changes the file. Each evaluated form gets an inline result that goes stale when edited.
function ready(n) {
  if (!fennel) return say("Fennel still loading"), false;
  const h = holes(n).find((x) => !isRep(x));
  if (h) { S.path = pathOf(h); draw(); return say("fill the holes first"), false; }
  if ((function bad(m) { return m.closed === false || m.bad || m.kids.some(bad); })(n)) return say("unbalanced, fix first"), false;
  return true;
}
function evalOne(n) {
  const r = evaluate(stripRep(text(n)));
  const last = r.text.split("\n").filter(Boolean).pop() || "(no value)";
  S.badges[pathOf(n).join(",")] = { src: text(n), text: short(last, 40), err: r.isError };
  return r;
}
function evalNode(n) {
  if (n === tree) return evalFile(false);
  if (!ready(n)) return;
  addLog(text(n), evalOne(n), "form");
  draw();
}
function restart(quiet) {
  if (!fennel) return say("Fennel still loading");
  evaluate(null); S.badges = {};
  if (!quiet) { note("REPL restarted: locals are gone, the file is unchanged."); draw(); }
}
function evalFile(fresh) {
  if (!S.src.trim()) return say("file is empty");
  if (!ready(tree)) return;
  if (fresh) restart(true);
  S.badges = {};
  const rs = forms(tree).map(evalOne); // form by form, so each gets its own result
  const r = { text: rs.map((x) => x.text).filter(Boolean).join("\n"), isError: rs.some((x) => x.isError) };
  addLog(S.src, r, fresh ? "fresh file" : "file");
  draw();
}

function addLog(src, r, what, toFile) {
  const box = document.createElement("div"); box.className = "entry";
  const head = document.createElement("div"); head.className = "in";
  const tag = document.createElement("span"); tag.className = "sub"; tag.textContent = what;
  const code = document.createElement("code"); code.textContent = short(src.replace(/\s+/g, " "), 60);
  head.append(tag, code);
  if (toFile) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = "→ file";
    b.addEventListener("click", () => {
      const k = parse(S.src).kids.length, base = S.src.replace(/\s+$/, "");
      commit(base + (base ? "\n" : "") + src, [k]); say("added to the file"); b.disabled = true; b.textContent = "in file";
    });
    head.append(b);
  }
  const out = document.createElement("div"); out.className = "out code" + (r.isError ? " err" : "");
  const use = document.createElement("button"); use.type = "button"; use.className = "use"; use.hidden = true;
  if (r.isError || !r.text) out.textContent = r.text || "(no value)";
  else {
    // Values come back in fennel.view syntax, so the same reader makes them a tree.
    const t = parse(r.text); const ctx = {};
    renderInto(out, t, r.text, ctx);
    let picked = null;
    out.addEventListener("click", (e) => {
      const el = e.target.closest(".n"); if (!el) return;
      out.querySelectorAll(".pick").forEach((x) => x.classList.remove("pick"));
      const n = ctx.nodes[+el.dataset.id];
      picked = picked === n && n.parent && n.parent.t !== "root" ? n.parent : n;
      out.querySelector(`[data-id="${ctx.nodes.indexOf(picked)}"]`).classList.add("pick");
      use.textContent = "Insert " + short(text(picked, r.text), 24) + " after focus";
      use.hidden = false;
    });
    use.addEventListener("click", () => { if (picked) insertText(close(text(picked, r.text))); });
  }
  box.append(head, out, use);
  logEl.append(box);
  logEl.scrollTop = logEl.scrollHeight;
}

// ------------------------------------------------------------ wiring ---
editor.addEventListener("click", (e) => {
  if (swiped) { swiped = false; return; }
  const el = e.target.closest(".n");
  const n = el ? edCtx.nodes[+el.dataset.id] : tree;
  const f = focusNode();
  S.head = null;
  if (n === f && f !== tree) S.path = pathOf(f.parent); // tap again: widen to the enclosing form
  else S.path = pathOf(n);
  if (S.mode) { S.mode = null; field.blur(); } // tapping the file means navigating: keyboard down
  draw();
});
let sx = 0, sy = 0, swiped = false;
editor.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; swiped = false; });
editor.addEventListener("pointerup", (e) => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dy) < 30) { swiped = true; sib(dx < 0 ? 1 : -1); }
});

for (const id of ["ctx", "nav"]) $(id).addEventListener("click", (e) => {
  const b = e.target.closest("button[data-op]"); if (b) ops[b.dataset.op]();
});
$("undo-btn").addEventListener("click", () => ops.undo());
// While typing, the entry row's buttons must not take focus, or the keyboard drops.
for (const id of ["done", "tpl-key"]) $(id).addEventListener("pointerdown", (e) => e.preventDefault());
$("done").addEventListener("click", closeEntry);
$("tpl-key").addEventListener("click", () => openSheet("tpl-sheet"));
$("entry").addEventListener("submit", (e) => { e.preventDefault(); const v = field.value; field.value = ""; submit(v); });

function setView(v) {
  S.view = v; if (S.mode) closeEntry();
  document.body.classList.toggle("view-repl", v === "repl");
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  logEl.scrollTop = logEl.scrollHeight;
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("repl-line").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!fennel) return;
  const f = $("repl-field"), c = close(f.value.trim()); if (!c) return;
  f.value = "";
  addLog(c.text, evaluate(c.text), "repl", true);
});
$("restart-btn").addEventListener("pointerdown", (e) => e.preventDefault());
$("restart-btn").addEventListener("click", () => restart());

// Keep the layout above the on-screen keyboard (iOS doesn't resize the layout viewport).
function syncHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty("--app-height", (vv ? vv.height : innerHeight) + "px"); }
(window.visualViewport || window).addEventListener("resize", syncHeight); syncHeight();

CASES.forEach((c, i) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.case = i;
  b.innerHTML = "<b></b>"; b.firstChild.textContent = c.name;
  b.addEventListener("click", () => loadCase(i));
  $("case-grid").append(b);
});
function loadCase(i) {
  const c = CASES[i];
  document.querySelectorAll("[data-case]").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.case === i)));
  setView("file");
  Object.assign(S, { undo: [], src: c.src, path: c.path, badges: {}, head: null, mode: null });
  $("steps-title").textContent = c.name;
  $("steps").innerHTML = "<ol>" + c.steps.map((s) => `<li>${s}</li>`).join("") + "</ol>";
  draw();
}
