<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR code</title>
<!--
  A QR code for any URL or text, drawn in the browser:
    misc/qr/?q=https%3A%2F%2Fexample.com     -> shows the code
    misc/qr/                                 -> a form; submitting it goes to ?q=...
  No server, no CDN: uqr.js sits next to this file. The ?q= link itself is the
  thing to bookmark or send. GitHub Pages ignores the query string, but it may
  show up in its request logs, so don't put secrets in it.
-->
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  /* Always dark on light, whatever the theme: phone cameras read that best. */
  #qr { background: #fff; border-radius: 8px; padding: 8px; width: min(80vw, 320px); margin: 0 auto; }
  #qr svg { display: block; width: 100%; height: auto; }
  #payload { word-break: break-all; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; margin: 12px 0; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  button, textarea { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  form { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  textarea { width: 100%; min-height: 4.5em; resize: vertical; }
  #err { color: #b00020; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<section id="view" hidden>
  <div id="qr"></div>
  <p id="payload"></p>
  <p id="err" hidden></p>
  <div class="row">
    <button type="button" id="copy">Copy text</button>
    <button type="button" id="share" hidden>Share…</button>
    <a href="./">New code</a>
  </div>
</section>

<section id="make" hidden>
  <h1>Make a QR code</h1>
  <form id="form">
    <label for="input">URL or text</label>
    <textarea id="input" required autofocus placeholder="https://…"></textarea>
    <button type="submit">Make QR code</button>
  </form>
</section>

<script type="module">
  import { encode } from "./uqr.js";

  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search).get("q") ?? "";

  // One square per dark module, all in one path. border: 4 is the quiet zone
  // scanners expect.
  function svg(text) {
    const { data } = encode(text, { ecc: "M", border: 4 });
    let d = "";
    data.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x} ${y}h1v1h-1z`; }));
    const n = data.length;
    const ns = "http://www.w3.org/2000/svg";
    const el = document.createElementNS(ns, "svg");
    el.setAttribute("viewBox", `0 0 ${n} ${n}`);
    el.setAttribute("shape-rendering", "crispEdges");
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", "QR code");
    const bg = document.createElementNS(ns, "rect");
    bg.setAttribute("width", String(n));
    bg.setAttribute("height", String(n));
    bg.setAttribute("fill", "#fff");
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", d);
    el.append(bg, path);
    return el;
  }

  if (q) {
    $("view").hidden = false;
    document.title = `QR: ${q}`;
    // Show a URL as a link, so this page also works as a redirect someone can tap.
    let url = null;
    try { url = new URL(q); } catch {}
    if (url && /^https?:$/.test(url.protocol)) {
      const a = document.createElement("a");
      a.href = url.href;
      a.textContent = q;
      $("payload").append(a);
    } else {
      $("payload").textContent = q;
    }
    try {
      $("qr").append(svg(q));
    } catch {
      $("qr").hidden = true;
      $("err").textContent = "Too long for a QR code. Try something shorter.";
      $("err").hidden = false;
    }
    $("copy").hidden = !navigator.clipboard;
    $("copy").addEventListener("click", () => navigator.clipboard.writeText(q));
    $("share").hidden = !navigator.share;
    $("share").addEventListener("click", () =>
      navigator.share(url ? { url: url.href } : { text: q }).catch(() => {}));
  } else {
    $("make").hidden = false;
    // Enter submits; Shift+Enter adds a line.
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
    });
    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (text) location.search = new URLSearchParams({ q: text }).toString();
    });
  }
</script>
</body>
</html>
