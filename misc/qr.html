<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR code</title>
<!--
  Shows a QR code for the URL after the #: qr.html#https://example.com/app/
  The pizza apps link here from Options. The URL stays in the hash, so it
  never reaches a server or the CDN. Not offline: scanning needs a network anyway.
-->
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  /* Always dark on light, whatever the theme: phone cameras read that best. */
  #qr { background: #fff; border-radius: 8px; padding: 8px; width: min(80vw, 320px); }
  #qr svg { display: block; width: 100%; height: auto; }
  #url { word-break: break-all; font-family: ui-monospace, monospace; font-size: 13px; margin: 12px 0; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button, input { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  form { display: flex; gap: 8px; margin-top: 20px; }
  form input { flex: 1; min-width: 0; }
  #err { color: #b00020; }
</style>
</head>
<body>
<h1>Scan to open</h1>
<div id="qr" hidden></div>
<p id="url"></p>
<p id="err" hidden></p>
<div class="row">
  <button type="button" id="copy" hidden>Copy link</button>
  <button type="button" id="share" hidden>Share…</button>
</div>
<form id="form">
  <input type="url" id="input" placeholder="https://…" aria-label="URL">
  <button type="submit">Show</button>
</form>

<script type="module">
  const $ = (id) => document.getElementById(id);

  function show(url) {
    $("url").textContent = url;
    $("copy").hidden = !navigator.clipboard;
    $("share").hidden = !navigator.share;
    $("input").value = url;
  }

  async function draw(url) {
    show(url);
    try {
      const { encode } = await import("https://cdn.jsdelivr.net/npm/uqr@0.1.3/+esm");
      const { data } = encode(url, { border: 4 });
      // One path: a 1x1 square per dark module.
      let d = "";
      data.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x} ${y}h1v1h-1z`; }));
      $("qr").innerHTML =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${data.length} ${data.length}" ` +
        `shape-rendering="crispEdges" role="img" aria-label="QR code for ${url.replace(/[<>&"]/g, "")}">` +
        `<rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; // warn-ok: innerhtml-assign
      $("qr").hidden = false;
      $("err").hidden = true;
    } catch (e) {
      $("err").textContent = "Couldn't draw the QR code (offline?). The link above still works.";
      $("err").hidden = false;
    }
  }

  function fromLocation() {
    let hash = location.hash.slice(1);
    try { hash = decodeURIComponent(hash); } catch {} // a hand-typed hash may not be encoded
    if (hash) return hash;
    // Followed from somewhere without a hash: offer that page.
    if (document.referrer && new URL(document.referrer).origin === location.origin) return document.referrer;
    return "";
  }

  $("copy").addEventListener("click", () => navigator.clipboard.writeText($("url").textContent));
  $("share").addEventListener("click", () => navigator.share({ url: $("url").textContent }).catch(() => {}));
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const url = $("input").value.trim();
    if (url) location.hash = encodeURIComponent(url);
  });
  addEventListener("hashchange", () => { const u = fromLocation(); if (u) draw(u); });

  const start = fromLocation();
  if (start) draw(start);
</script>
</body>
</html>
