<!doctype html>
<html lang="en" data-theme="dulles">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content is half of the keyboard fix; the other
     half is syncAppHeight() in lib/viewport.js. Neither works alone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#008080">
<title>carousel</title>
<!-- localStorage key prefix; state.js and the theme script below read it. -->
<meta name="app-ns" content="carousel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/carousel.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
<script type="importmap">
{
  "imports": {
    "lit": "./vendor/lit.js",
    "lit/directives/repeat.js": "./vendor/lit.js"
  }
}
</script>
<script>
// Runs before first paint so the chosen theme doesn't flash the default one.
(function () {
  try {
    var ns = document.querySelector('meta[name="app-ns"]').getAttribute("content");
    var t = localStorage.getItem(ns + ":theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1>carousel <span class="tagline"></span></h1>
  <span class="header-btns">
    <button id="spin-btn" class="btn spin" type="button" aria-label="Spin to a random card">spin</button>
    <button id="settings-btn" class="btn" type="button" aria-label="Options" aria-haspopup="dialog">options</button>
  </span>
</header>

<main class="panels">
  <cr-deck></cr-deck>
</main>

<cr-reader></cr-reader>
<cr-editor></cr-editor>

<dialog id="settings-dialog" class="settings window">
  <div class="titlebar"><span>options</span></div>

  <section>
    <h3>Theme</h3>
    <div class="swatches" role="radiogroup" aria-label="Theme">
      <button type="button" class="swatch" role="radio" data-set-theme="dulles" aria-checked="true" aria-label="Dulles"><span style="background:linear-gradient(135deg,#008080 50%,#c0c0c0 50%)"></span>dulles</button>
      <button type="button" class="swatch" role="radio" data-set-theme="south-park" aria-checked="false" aria-label="South Park"><span style="background:linear-gradient(135deg,#c0deed 50%,#ffffff 50%)"></span>south park</button>
      <button type="button" class="swatch" role="radio" data-set-theme="santa-monica" aria-checked="false" aria-label="Santa Monica"><span style="background:linear-gradient(135deg,#003399 50%,#ff6600 50%)"></span>santa monica</button>
      <button type="button" class="swatch" role="radio" data-set-theme="cupertino" aria-checked="false" aria-label="Cupertino"><span style="background:linear-gradient(135deg,#f4f4f2 50%,#c9cfc3 50%)"></span>cupertino</button>
    </div>
  </section>

  <section>
    <h3>Reading</h3>
    <div class="modes">
      <label>youtube <select data-mode="youtube"><option value="embed">embed</option><option value="open">open app/tab</option><option value="page">page in frame</option></select></label>
      <label>instagram <select data-mode="instagram"><option value="embed">embed</option><option value="open">open app/tab</option><option value="page">page in frame</option></select></label>
      <label>facebook <select data-mode="facebook"><option value="embed">embed</option><option value="open">open app/tab</option><option value="page">page in frame</option></select></label>
    </div>
  </section>

  <section>
    <h3>Deck <span id="deck-counts" class="dim"></span></h3>
    <form id="add-form" class="row">
      <input id="add-url" type="url" placeholder="paste a link" aria-label="Link to add">
      <button class="btn">add</button>
    </form>
    <div class="row wrap">
      <button type="button" id="export-all" class="btn">export all</button>
      <button type="button" id="export-read" class="btn">export read</button>
      <button type="button" id="delete-read" class="btn danger">delete read</button>
    </div>
  </section>

  <section>
    <h3>Share</h3>
    <!-- A global page, not part of this app: psychic-meme/misc/qr/ draws a QR
         code for whatever ?q= holds. app.js adds ?q=<this app's URL>. -->
    <a id="share-link" class="share-link" href="https://devp.github.io/psychic-meme/misc/qr/" target="_blank" rel="noopener">Show a QR code for this app ↗</a>
  </section>

  <button type="button" id="settings-close" class="btn primary">done</button>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
