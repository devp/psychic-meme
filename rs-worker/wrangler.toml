name = "rs-worker"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# One R2 bucket holds both documents (data/...) and hashed tokens (tokens/...).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "remotestorage"

[vars]
RS_USER = "dev"                                        # address becomes dev@<storage host>
MAX_DOC_BYTES = "10485760"                             # 10 MB per document -> 413 above this
AUTH_ORIGIN = "https://auth.example.com"               # hostname Cloudflare Access protects
ACCESS_TEAM = "https://yourteam.cloudflareaccess.com"  # Zero Trust team domain, with https://
ACCESS_AUD = "<Access application AUD tag>"
# ACCESS_EMAIL = "you@example.com"                     # optional extra check on top of the Access policy
