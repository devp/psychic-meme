<!doctype html>
<html lang="en" data-theme="dusk" data-font="mono">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content is half of the keyboard fix; the other
     half is syncAppHeight() in lib/viewport.js. Neither works alone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#12141a">
<!-- The one line that differs between pizza-repl-<lang> apps: the app's name,
     and its localStorage key prefix (state.js and the script below read it). -->
<meta name="app-ns" content="pizza-repl">
<title>pizza-repl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/repl.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
<script type="importmap">
{
  "imports": {
    "lit": "./vendor/lit.js",
    "lit/directives/repeat.js": "./vendor/lit.js"
  }
}
</script>
<script>
// Runs before first paint so the chosen theme doesn't flash the default one.
(function () {
  try {
    var ns = document.querySelector('meta[name="app-ns"]').getAttribute("content");
    document.title = ns;
    var t = localStorage.getItem(ns + ":theme");
    var f = localStorage.getItem(ns + ":font");
    if (t) document.documentElement.setAttribute("data-theme", t);
    if (f) document.documentElement.setAttribute("data-font", f);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1 id="app-title">pizza-repl</h1>
  <script>document.getElementById("app-title").textContent = document.title;</script>
  <button id="settings-btn" class="icon-btn" type="button" aria-label="Options" aria-haspopup="dialog">∆</button>
</header>

<repl-tabs class="tabs"></repl-tabs>

<main class="panels">
  <!-- Drops down over the docs panel when its tab is tapped again. -->
  <div id="doc-menu" class="doc-menu" role="menu" aria-label="Docs" hidden></div>

  <section class="panel repl-panel active" data-panel="repl">
    <append-log id="output" class="output"></append-log>
    <div class="suggest-row" id="suggest-row" hidden aria-label="Completions"></div>
    <!-- Filled from lang.keys, with the ⋯ (commands) key in the middle. -->
    <div class="key-row" id="key-row"></div>
    <form class="input-row" id="input-form">
      <textarea id="input" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button type="submit" id="run-btn">Run</button>
    </form>
  </section>

  <!-- One tab for all of lang.docs. It shows the doc you last read; tap it
       again for the menu of the others. -->
  <section class="panel" data-panel="docs" id="docs-panel"></section>

  <section class="panel" data-panel="log">
    <div class="add-row">
      <button type="button" id="new-session-btn">+ New session</button>
    </div>
    <session-list id="session-list"></session-list>
  </section>
</main>

<button id="doc-index-btn" class="fab" type="button" aria-label="Jump to section" aria-haspopup="dialog" hidden>≡</button>

<dialog id="doc-index-dialog" class="settings">
  <h2>Jump to section</h2>
  <div class="doc-index-list" id="doc-index-list"></div>
  <button type="button" class="primary" data-close>Close</button>
</dialog>

<dialog id="commands-dialog" class="settings">
  <h2>Commands</h2>
  <div class="command-list" id="commands-list"></div>
  <button type="button" class="primary" data-close>Close</button>
</dialog>

<dialog id="session-dialog" class="settings session-dialog">
  <div class="session-dialog-header">
    <input id="session-name" type="text" placeholder="Untitled session" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Session name">
    <button type="button" id="session-export-btn" class="icon-btn" aria-label="Copy as commented source" title="Copy as source">📋</button>
    <button type="button" id="session-delete-btn" class="icon-btn" aria-label="Delete session">🗑</button>
  </div>
  <append-log id="session-view" class="output"></append-log>
  <button type="button" class="primary" data-close>Close</button>
</dialog>

<dialog id="settings-dialog" class="settings">
  <h2>Options</h2>

  <section>
    <h3>Theme</h3>
    <div class="swatches" role="radiogroup" aria-label="Theme">
      <button type="button" class="swatch" role="radio" data-set-theme="dusk" aria-checked="true" aria-label="Dusk"><span style="background:#12141a"></span>dusk</button>
      <button type="button" class="swatch" role="radio" data-set-theme="paper" aria-checked="false" aria-label="Paper"><span style="background:#faf7f0"></span>paper</button>
      <button type="button" class="swatch" role="radio" data-set-theme="phosphor" aria-checked="false" aria-label="Phosphor"><span style="background:#050805"></span>phosphor</button>
    </div>
  </section>

  <section>
    <h3>Font</h3>
    <div class="swatches" role="radiogroup" aria-label="Font">
      <button type="button" class="swatch" role="radio" data-set-font="mono" aria-checked="true">mono</button>
      <button type="button" class="swatch" role="radio" data-set-font="sans" aria-checked="false">sans</button>
    </div>
  </section>

  <section>
    <h3>Tapping &gt; on an entry</h3>
    <div class="swatches" role="radiogroup" aria-label="Tapping the caret on an entry">
      <button type="button" class="swatch" role="radio" data-set-caret="both" aria-checked="true">copy + fill input</button>
      <button type="button" class="swatch" role="radio" data-set-caret="copy" aria-checked="false">copy only</button>
      <button type="button" class="swatch" role="radio" data-set-caret="fill" aria-checked="false">fill input only</button>
    </div>
  </section>

  <section id="suggest-section" hidden>
    <h3>Completions while typing</h3>
    <div class="swatches" role="radiogroup" aria-label="Completions while typing">
      <button type="button" class="swatch" role="radio" data-set-suggest="on" aria-checked="true">on</button>
      <button type="button" class="swatch" role="radio" data-set-suggest="off" aria-checked="false">off</button>
    </div>
    <p class="hint">After two characters. Tab completes on a keyboard.</p>
  </section>

  <section>
    <h3>Command shortcuts (⋯ key)</h3>
    <input id="commands-field" class="text-field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command shortcuts, comma-separated">
    <p class="hint" id="commands-hint">Comma-separated, listed after the defaults.</p>
  </section>

  <section>
    <h3>Session</h3>
    <div class="swatches">
      <button type="button" class="swatch" id="clear-output-btn">Clear output</button>
      <button type="button" class="swatch" id="settings-new-session-btn">New session</button>
    </div>
  </section>

  <section class="about">
    <h3>About</h3>
    <div id="about-lang"></div>
  </section>

  <section>
    <h3>Share</h3>
    <!-- A global page, not part of this app: psychic-meme/misc/qr/ draws a QR
         code for whatever ?q= holds. app.js adds ?q=<this app's URL>. -->
    <a id="share-link" class="share-link" href="https://devp.github.io/psychic-meme/misc/qr/" target="_blank" rel="noopener">Show a QR code for this app ↗</a>
  </section>

  <button type="button" class="primary" data-close>Done</button>
</dialog>

<!-- A classic script: it defines a global (UMD build, not a module). Module
     scripts run after it. lang.js loads its own engine (lib/engine.js). -->
<script src="vendor/marked.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
