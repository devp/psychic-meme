<!doctype html>
<html lang="en" data-theme="dusk" data-font="serif">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content is half of the keyboard fix; the other
     half is syncAppHeight() in lib/viewport.js. Neither works alone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16181d">
<title>detype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/detype.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "lit": "./vendor/lit.js",
    "lit/directives/repeat.js": "./vendor/lit.js"
  }
}
</script>
<script>
// Runs before first paint so the chosen theme doesn't flash the default one.
// Keep these keys in sync with NS in state.js.
(function () {
  try {
    var t = localStorage.getItem("detype:theme");
    var f = localStorage.getItem("detype:font");
    if (t) document.documentElement.setAttribute("data-theme", t);
    if (f) document.documentElement.setAttribute("data-font", f);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1>detype</h1>
  <button id="settings-btn" class="icon-btn" type="button" aria-label="Options" aria-haspopup="dialog">∆</button>
</header>

<pizza-tabs class="tabs"></pizza-tabs>

<main class="panels">
  <section class="panel write active" data-panel="write">
    <div class="write-space">
      <ghost-lines id="ghosts"></ghost-lines>
      <label for="line" class="visually-hidden">Write a line. Enter lets it go.</label>
      <textarea id="line" rows="1" autocomplete="off" autocapitalize="sentences"
        spellcheck="false" enterkeyhint="enter"></textarea>
      <p id="hint" class="hint">write a line · enter lets it go</p>
      <p id="save-warning" class="save-warning" role="alert" hidden>
        This line didn't save: storage is full or blocked. Download your pages, then delete some old ones.
      </p>
    </div>
    <div id="goal" class="goal" hidden>
      <div id="goal-fill" class="goal-fill"></div>
    </div>
  </section>

  <section class="panel" data-panel="pages">
    <pages-list id="pages-list"></pages-list>
  </section>
</main>

<dialog id="settings-dialog" class="settings">
  <h2>Options</h2>

  <section>
    <h3>Theme</h3>
    <div class="swatches" role="radiogroup" aria-label="Theme">
      <button type="button" class="swatch" role="radio" data-set-theme="dusk" aria-checked="true" aria-label="Dusk"><span style="background:#16181d"></span>dusk</button>
      <button type="button" class="swatch" role="radio" data-set-theme="linen" aria-checked="false" aria-label="Linen"><span style="background:#f5f1e8"></span>linen</button>
    </div>
  </section>

  <section>
    <h3>Font</h3>
    <div class="swatches" role="radiogroup" aria-label="Font">
      <button type="button" class="swatch" role="radio" data-set-font="serif" aria-checked="true">serif</button>
      <button type="button" class="swatch" role="radio" data-set-font="sans" aria-checked="false">sans</button>
      <button type="button" class="swatch" role="radio" data-set-font="mono" aria-checked="false">mono</button>
    </div>
  </section>

  <section>
    <h3>Daily goal <span class="quiet">— a hairline that fills, nothing more</span></h3>
    <div class="swatches" role="radiogroup" aria-label="Goal unit">
      <button type="button" class="swatch" role="radio" data-set-goal="off" aria-checked="true">off</button>
      <button type="button" class="swatch" role="radio" data-set-goal="words" aria-checked="false">words</button>
      <button type="button" class="swatch" role="radio" data-set-goal="chars" aria-checked="false">chars</button>
      <button type="button" class="swatch" role="radio" data-set-goal="lines" aria-checked="false">lines</button>
    </div>
    <label class="goal-target">
      <input id="goal-target" type="number" inputmode="numeric" min="1" step="1" class="field">
      <span id="goal-target-unit" class="quiet"></span>
    </label>
  </section>

  <p class="quiet small">Pages live only in this browser. Download them now and then if you want to keep them.</p>

  <button type="button" id="settings-close" class="primary">Done</button>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
